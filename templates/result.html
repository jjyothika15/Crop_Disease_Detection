<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prediction Result</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🌱 Analysis Result</h1>

            <img
                src="{{ url_for('static', filename='uploads/' + image_path.split('/')[-1]) }}"
                class="leaf-image"
                alt="Uploaded leaf"
            >

            <div class="result">

                <h2>{{ crop }}</h2>

                <h3>{{ disease }}</h3>

                <p>
                    Confidence:
                    <strong>{{ confidence }}%</strong>
                </p>

            </div>

            <a href="/" class="button">
                Analyze Another Image
            </a>

        </div>

    </div>

</body>

</html>
